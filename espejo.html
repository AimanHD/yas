<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Para ti, Yasmin ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#080502; touch-action:none; user-select:none;
      -webkit-user-select:none;
    }
    canvas { position:fixed; inset:0; display:block }
    #scene { z-index:1 }
    #fog   { z-index:2; cursor:crosshair }

    /* ── HINT ── */
    #hint {
      position:fixed; inset:0; z-index:5;
      display:flex; flex-direction:column;
      align-items:center; justify-content:flex-end;
      padding-bottom:clamp(2.5rem,8vh,4.5rem);
      pointer-events:none;
      opacity:0; animation:fadein 1.2s ease 1.4s forwards;
      transition:opacity 1s;
    }
    #hint.gone { opacity:0!important; animation:none }
    @keyframes fadein { to{ opacity:1 } }

    .hint-hand {
      font-size:2.2rem; display:block;
      animation:swipe 2.2s ease-in-out infinite;
      margin-bottom:.65rem;
    }
    @keyframes swipe {
      0%   { transform:translate(0,0) }
      30%  { transform:translate(38px,-10px) }
      60%  { transform:translate(70px,0) }
      100% { transform:translate(0,0) }
    }
    .hint-text {
      font-family:'Cormorant Garamond', serif; font-style:italic;
      font-size:clamp(.85rem,2.8vw,1.05rem);
      color:rgba(210,185,145,.52); letter-spacing:.1em; text-align:center;
    }

    /* ── FINALE ── */
    #finale {
      position:fixed; inset:0; z-index:8;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:2.5rem;
      opacity:0; pointer-events:none;
      transition:opacity 2.4s;
    }
    #finale.show { opacity:1 }
    .f-small {
      font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:300;
      font-size:clamp(.85rem,2.8vw,1.05rem);
      color:rgba(220,190,150,.65); letter-spacing:.12em; margin-bottom:1.4rem;
    }
    .f-heart {
      font-size:clamp(2.5rem,10vw,5rem);
      color:rgba(220,70,100,.88);
      filter:drop-shadow(0 0 24px rgba(220,60,90,.6));
      animation:hbeat 1.9s ease-in-out infinite;
      display:block; margin-bottom:.9rem;
    }
    @keyframes hbeat {
      0%,100%{ transform:scale(1) }
      15%{ transform:scale(1.22) }
      30%{ transform:scale(1) }
      50%{ transform:scale(1.12) }
    }
    .f-title {
      font-family:'Dancing Script', cursive; font-weight:700;
      font-size:clamp(3rem,13vw,6rem);
      color:rgba(255,220,120,.96);
      text-shadow:0 0 60px rgba(255,200,80,.5), 0 0 120px rgba(255,170,50,.2);
      line-height:1.15; margin-bottom:.7rem;
    }
    .f-sub {
      font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:300;
      font-size:clamp(.95rem,3.2vw,1.25rem);
      color:rgba(225,195,155,.72); line-height:2;
    }

    @media(max-width:380px){
      .f-title{ font-size:clamp(2.4rem,14vw,4rem) }
    }
  </style>
</head>
<body>

<canvas id="scene"></canvas>
<canvas id="fog"></canvas>
<audio id="bgm" loop></audio>

<div id="hint">
  <span class="hint-hand">🤍</span>
  <div class="hint-text">pasa el dedo por el espejo…<br>hay algo escondido para ti</div>
</div>

<div id="finale">
  <div class="f-small">lo has descubierto todo</div>
  <span class="f-heart">♥</span>
  <div class="f-title">Te amo,<br>Yasmin</div>
  <div class="f-sub">me encantas cada día<br>muchísimo más</div>
</div>

<script>
// ── CANVASES ──
const sc=document.getElementById('scene'), scC=sc.getContext('2d');
const fg=document.getElementById('fog'),   fgC=fg.getContext('2d');
let W=0, H=0;

function resize(){
  W=sc.width=fg.width=innerWidth;
  H=sc.height=fg.height=innerHeight;
}

// ── WORDS HIDDEN BEHIND FOG ──
const WORDS=[
  {t:'Yasmin',      x:.500,y:.460,s:.118,c:'#ffd060',glow:45,f:'Dancing Script',w:'700',a:0},
  {t:'hermosa',     x:.170,y:.170,s:.052,c:'#f0c870',glow:0, f:'Cormorant Garamond',w:'400',a:-13},
  {t:'te quiero',   x:.790,y:.195,s:.045,c:'#f5d280',glow:0, f:'Cormorant Garamond',w:'400',a:9},
  {t:'mi favorita', x:.115,y:.440,s:.039,c:'#e8b860',glow:0, f:'Cormorant Garamond',w:'400',a:-7},
  {t:'eres única',  x:.835,y:.540,s:.041,c:'#f2c878',glow:0, f:'Cormorant Garamond',w:'400',a:11},
  {t:'me alegras',  x:.110,y:.730,s:.038,c:'#e0b048',glow:0, f:'Cormorant Garamond',w:'400',a:-9},
  {t:'gracias',     x:.825,y:.800,s:.050,c:'#f0c060',glow:0, f:'Cormorant Garamond',w:'400',a:7},
  {t:'te pienso',   x:.530,y:.125,s:.035,c:'#d8a840',glow:0, f:'Cormorant Garamond',w:'400',a:5},
  {t:'especial',    x:.360,y:.840,s:.044,c:'#e8b860',glow:0, f:'Cormorant Garamond',w:'400',a:-6},
  {t:'siempre',     x:.390,y:.270,s:.033,c:'#c89030',glow:0, f:'Cormorant Garamond',w:'400',a:8},
  {t:'te amo',      x:.275,y:.630,s:.039,c:'#f5d080',glow:0, f:'Cormorant Garamond',w:'400',a:-11},
  {t:'eres mía',    x:.700,y:.665,s:.037,c:'#e0b050',glow:0, f:'Cormorant Garamond',w:'400',a:13},
  {t:'♥',           x:.225,y:.330,s:.075,c:'#d04060',glow:20,f:'serif',w:'400',a:0},
  {t:'♥',           x:.840,y:.375,s:.056,c:'#c83850',glow:15,f:'serif',w:'400',a:0},
  {t:'♥',           x:.500,y:.720,s:.050,c:'#d04060',glow:18,f:'serif',w:'400',a:0},
  {t:'♥',           x:.155,y:.570,s:.040,c:'#b82840',glow:12,f:'serif',w:'400',a:0},
  {t:'♥',           x:.660,y:.290,s:.033,c:'#c03050',glow:10,f:'serif',w:'400',a:0},
];

function drawScene(){
  const u=Math.min(W,H);
  // Warm dark background
  const bg=scC.createRadialGradient(W*.5,H*.44,0,W*.5,H*.5,Math.max(W,H)*.78);
  bg.addColorStop(0,'#301506'); bg.addColorStop(.4,'#1c0a04'); bg.addColorStop(1,'#0c0503');
  scC.fillStyle=bg; scC.fillRect(0,0,W,H);
  // Soft warm glow center
  const cg=scC.createRadialGradient(W*.5,H*.46,0,W*.5,H*.46,Math.min(W,H)*.35);
  cg.addColorStop(0,'rgba(60,25,5,.45)'); cg.addColorStop(1,'rgba(0,0,0,0)');
  scC.fillStyle=cg; scC.fillRect(0,0,W,H);

  WORDS.forEach(w=>{
    const fs=Math.round(w.s*u);
    scC.save();
    scC.translate(w.x*W,w.y*H);
    scC.rotate(w.a*Math.PI/180);
    scC.font=`${w.w} italic ${fs}px '${w.f}', ${w.f==='Dancing Script'?'cursive':'serif'}`;
    scC.textAlign='center'; scC.textBaseline='middle';
    if(w.glow){ scC.shadowBlur=w.glow; scC.shadowColor=w.c }
    scC.globalAlpha=w.glow>15?.95:.80;
    scC.fillStyle=w.c;
    scC.fillText(w.t,0,0);
    scC.shadowBlur=0; scC.globalAlpha=1;
    scC.restore();
  });
}

function initFog(){
  fgC.clearRect(0,0,W,H);
  fgC.globalCompositeOperation='source-over';
  // Base fog — dark blue-gray (cold mirror)
  fgC.fillStyle='rgba(50,44,66,1)';
  fgC.fillRect(0,0,W,H);
  // Texture: random light patches
  for(let i=0;i<14;i++){
    const gx=Math.random()*W, gy=Math.random()*H;
    const gr=fgC.createRadialGradient(gx,gy,0,gx,gy,55+Math.random()*110);
    gr.addColorStop(0,`rgba(${72+Math.random()*18|0},${64+Math.random()*14|0},${90+Math.random()*20|0},0.38)`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    fgC.fillStyle=gr; fgC.fillRect(0,0,W,H);
  }
  // Subtle drip streaks
  for(let i=0;i<22;i++){
    const sx=Math.random()*W, sy=Math.random()*H*.55;
    const sh=20+Math.random()*75;
    const sl=fgC.createLinearGradient(sx,sy,sx,sy+sh);
    sl.addColorStop(0,'rgba(88,78,110,0)');
    sl.addColorStop(.38,'rgba(88,78,110,.2)');
    sl.addColorStop(1,'rgba(88,78,110,0)');
    fgC.fillStyle=sl; fgC.fillRect(sx-.9,sy,1.8,sh);
  }
}

// ── WIPE ──
let wiping=false, lx=0, ly=0, finaleShown=false;
const br=()=>Math.min(W,H)*.07;

function wipeAt(x,y){
  fgC.globalCompositeOperation='destination-out';
  fgC.lineCap='round'; fgC.lineJoin='round';
  if(wiping){
    fgC.beginPath(); fgC.moveTo(lx,ly); fgC.lineTo(x,y);
    fgC.lineWidth=br()*2;
    fgC.strokeStyle='rgba(0,0,0,1)';
    fgC.stroke();
  }
  fgC.beginPath(); fgC.arc(x,y,br(),0,Math.PI*2);
  fgC.fillStyle='rgba(0,0,0,1)'; fgC.fill();
  lx=x; ly=y;
}

function checkReveal(){
  if(finaleShown)return;
  const d=fgC.getImageData(0,0,W,H).data;
  let clear=0,total=0;
  for(let i=3;i<d.length;i+=48){ if(d[i]<55)clear++; total++ }
  if(clear/total>.5)triggerFinale();
}

// ── POINTER EVENTS ──
const hint=document.getElementById('hint');
let hintGone=false;

function hideHint(){ if(!hintGone){ hint.classList.add('gone'); hintGone=true } }
function getXY(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY} }

fg.addEventListener('mousedown',e=>{ wiping=true; const{x,y}=getXY(e); lx=x;ly=y; wipeAt(x,y); hideHint() });
fg.addEventListener('mousemove',e=>{ if(!wiping)return; const{x,y}=getXY(e); wipeAt(x,y) });
fg.addEventListener('mouseup',  ()=>{ wiping=false; checkReveal() });
fg.addEventListener('mouseleave',()=>{ wiping=false });

fg.addEventListener('touchstart',e=>{ e.preventDefault(); wiping=true; const{x,y}=getXY(e); lx=x;ly=y; wipeAt(x,y); hideHint() },{passive:false});
fg.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; wipeAt(t.clientX,t.clientY) },{passive:false});
fg.addEventListener('touchend',  e=>{ e.preventDefault(); wiping=false; checkReveal() },{passive:false});

// ── FINALE ──
const finale=document.getElementById('finale');
let clearPass=0;

function clearFogAnim(){
  clearPass++;
  fgC.save();
  fgC.globalCompositeOperation='destination-out';
  fgC.globalAlpha=.11;
  fgC.fillStyle='rgba(0,0,0,1)';
  fgC.fillRect(0,0,W,H);
  fgC.restore();
  if(clearPass<38) requestAnimationFrame(clearFogAnim);
  else{ fgC.clearRect(0,0,W,H); finale.classList.add('show') }
}

function triggerFinale(){
  finaleShown=true;
  hideHint();
  setTimeout(()=>requestAnimationFrame(clearFogAnim), 350);
}

// ── MUSIC ──
const bgm=document.getElementById('bgm');
bgm.src='[TubePull] Amr_Diab_-_Al_Leila_عمرو_دياب_-_الليلة.m4a';
bgm.volume=.72;
function tryPlay(){ bgm.play().catch(()=>{}) }
tryPlay();
['click','touchstart'].forEach(ev=>document.addEventListener(ev,tryPlay,{once:true}));

// ── INIT ──
resize();
window.addEventListener('resize',()=>{ resize(); drawScene(); initFog() });
document.fonts.ready.then(()=>{ drawScene(); initFog() });
</script>
</body>
</html>
