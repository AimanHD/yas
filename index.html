<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Buenas noches, Yasmin ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#04030e; font-family:'Cormorant Garamond', serif;
      -webkit-font-smoothing:antialiased; user-select:none;
    }
    canvas { position:fixed; inset:0; display:block }

    /* ── MOON ── */
    #moon {
      position:fixed; top:4%; right:6%;
      width:clamp(65px,14vw,100px);
      filter: drop-shadow(0 0 18px rgba(230,210,170,.45)) drop-shadow(0 0 50px rgba(220,190,140,.14));
      z-index:5; animation: moon-drift 9s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes moon-drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

    /* ── THOUGHT STARS ── */
    .tstar {
      position:fixed; left:var(--x); top:var(--y);
      width:52px; height:52px;
      transform:translate(-50%,-50%);
      cursor:pointer; z-index:10;
      display:flex; align-items:center; justify-content:center;
      opacity:0; transition:opacity 1.4s;
    }
    .tstar.active { opacity:1 }
    .tstar.found  { cursor:default }

    .sshape {
      width:13px; height:13px;
      background:#ffd888;
      clip-path:polygon(50% 0%,61% 35%,98% 38%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 38%,39% 35%);
      filter:drop-shadow(0 0 5px rgba(255,210,100,.95)) drop-shadow(0 0 14px rgba(255,185,60,.6));
      animation:sbeat var(--d,2.8s) ease-in-out infinite;
      transition:filter 1.2s, background 1.2s;
    }
    .tstar.found .sshape {
      background:rgba(255,210,100,.18);
      filter:drop-shadow(0 0 2px rgba(255,210,100,.2));
      animation:none;
    }
    @keyframes sbeat {
      0%,100%{ transform:scale(1) rotate(0deg) }
      50%{ transform:scale(1.65) rotate(20deg) }
    }

    /* ── INTRO ── */
    #intro {
      position:fixed; inset:0; z-index:50;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:2.5rem;
      pointer-events:none;
      transition:opacity 1.6s;
    }
    #intro.gone { opacity:0 }

    .iline {
      opacity:0; animation:irise .9s ease forwards;
      line-height:2.1; color:rgba(240,228,208,.85);
    }
    .iline:nth-child(1){ font-style:italic; font-size:clamp(.9rem,3vw,1.2rem); color:rgba(200,188,170,.7); animation-delay:.6s }
    .iline:nth-child(2){ font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(1.9rem,7vw,3.2rem); animation-delay:1.8s; text-shadow:0 0 30px rgba(255,200,120,.25) }
    .iline:nth-child(3){ font-style:italic; font-size:clamp(.82rem,2.5vw,1rem); animation-delay:3.2s; color:rgba(200,175,145,.55); letter-spacing:.18em }
    @keyframes irise {
      from{ opacity:0; transform:translateY(9px) }
      to  { opacity:1; transform:translateY(0) }
    }

    /* ── MESSAGE CARD ── */
    #mcard {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%) scale(.87);
      z-index:60;
      background:rgba(5,3,16,.97);
      border:1px solid rgba(255,210,100,.2);
      border-radius:12px;
      padding:clamp(1.8rem,5vw,2.6rem) clamp(1.5rem,5vw,2.4rem);
      max-width:min(370px,88vw);
      text-align:center;
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      box-shadow:0 0 80px rgba(255,180,60,.07), 0 24px 70px rgba(0,0,0,.7);
      opacity:0; pointer-events:none;
      transition:opacity .55s, transform .55s;
    }
    #mcard.show { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto }
    .mheart { font-size:1.5rem; color:rgba(220,80,100,.7); display:block; margin-bottom:.9rem }
    .mtext  {
      font-style:italic; font-weight:400;
      font-size:clamp(1.12rem,4vw,1.48rem);
      color:rgba(248,236,218,.88);
      line-height:1.75; margin-bottom:1.2rem;
    }
    .mhint  { font-size:clamp(.65rem,2vw,.78rem); letter-spacing:.22em; color:rgba(190,165,130,.3); text-transform:uppercase }

    /* ── COUNTER ── */
    #ctr {
      position:fixed; bottom:clamp(1.2rem,3.5vh,2.2rem); left:50%;
      transform:translateX(-50%); z-index:15;
      font-style:italic; font-size:clamp(.76rem,2.3vw,.92rem);
      color:rgba(255,210,130,.38); letter-spacing:.16em;
      opacity:0; transition:opacity .6s; white-space:nowrap;
    }
    #ctr.on { opacity:1 }

    /* ── FINALE ── */
    #finale {
      position:fixed; inset:0; z-index:70;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:3rem;
      opacity:0; pointer-events:none;
      transition:opacity 2s;
    }
    #finale.show { opacity:1 }
    .fheart {
      font-size:clamp(3rem,12vw,5.5rem);
      color:rgba(220,75,100,.8);
      animation:hbeat 1.8s ease-in-out infinite;
      filter:drop-shadow(0 0 22px rgba(220,60,90,.45));
      margin-bottom:.6rem; display:block;
    }
    @keyframes hbeat {
      0%,100%{transform:scale(1)}
      15%{transform:scale(1.2)}
      30%{transform:scale(1)}
      50%{transform:scale(1.12)}
    }
    .ftitle {
      font-family:'Dancing Script', cursive; font-weight:700;
      font-size:clamp(2.2rem,9vw,3.8rem);
      color:rgba(250,240,224,.92);
      text-shadow:0 0 50px rgba(255,200,120,.25);
      line-height:1.25; margin-bottom:.6rem;
    }
    .fsub {
      font-style:italic; font-weight:300;
      font-size:clamp(1rem,3.5vw,1.32rem);
      color:rgba(224,208,184,.7);
      line-height:2; max-width:340px;
      margin-bottom:1.6rem;
    }
    .fstars { font-size:clamp(.9rem,3vw,1.2rem); letter-spacing:.35em; color:rgba(255,210,100,.4) }

    @media(max-width:380px){
      #moon{ width:58px }
      .iline:nth-child(2){ font-size:clamp(1.6rem,10vw,2.4rem) }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<audio id="bgm" loop></audio>

<!-- Moon -->
<div id="moon">
  <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="mm">
        <rect width="90" height="90" fill="white"/>
        <circle cx="57" cy="31" r="33" fill="black"/>
      </mask>
    </defs>
    <circle cx="37" cy="44" r="33" fill="#ffeedd" mask="url(#mm)"/>
    <circle cx="30" cy="52" r="2.2" fill="rgba(190,150,110,.18)"/>
    <circle cx="42" cy="37" r="1.6" fill="rgba(190,150,110,.15)"/>
    <circle cx="24" cy="39" r="1.2" fill="rgba(190,150,110,.12)"/>
  </svg>
</div>

<!-- 8 thought stars (positioned to avoid center and moon) -->
<div class="tstar" data-i="0" style="--x:17%;--y:21%;--d:3.1s"></div>
<div class="tstar" data-i="1" style="--x:56%;--y:12%;--d:2.5s"></div>
<div class="tstar" data-i="2" style="--x:30%;--y:44%;--d:3.5s"></div>
<div class="tstar" data-i="3" style="--x:84%;--y:46%;--d:2.9s"></div>
<div class="tstar" data-i="4" style="--x:9%; --y:63%;--d:3.8s"></div>
<div class="tstar" data-i="5" style="--x:63%;--y:58%;--d:2.4s"></div>
<div class="tstar" data-i="6" style="--x:80%;--y:79%;--d:3.3s"></div>
<div class="tstar" data-i="7" style="--x:33%;--y:81%;--d:2.7s"></div>

<!-- Intro overlay -->
<div id="intro">
  <div class="iline">Esta noche...</div>
  <div class="iline">he escondido algo entre las estrellas</div>
  <div class="iline">toca las estrellas doradas ✦</div>
</div>

<!-- Message card -->
<div id="mcard">
  <span class="mheart">♥</span>
  <div class="mtext" id="mtext"></div>
  <div class="mhint">toca para cerrar</div>
</div>

<!-- Found counter -->
<div id="ctr">✦ 0 de 8 pensamientos encontrados</div>

<!-- Finale -->
<div id="finale">
  <span class="fheart">♥</span>
  <div class="ftitle">Buenas noches,<br>Yasmin</div>
  <div class="fsub">
    Que descanses bien.<br>
    Te amo más de lo que<br>saben estas estrellas.
  </div>
  <div class="fstars">✦ &nbsp; ✦ &nbsp; ✦</div>
</div>

<script>
// ══ STARFIELD ══
const cv=document.getElementById('bg'), ctx=cv.getContext('2d');
let W,H;
const S=(()=>{let s=77;const r=()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff};return Array.from({length:230},()=>({px:r(),py:r(),r:r()*1.1+.2,a:r()*.48+.2,ts:r()*.007+.002,to:r()*Math.PI*2,c:r()>.8?'#c8d4ff':(r()>.6?'#dde8ff':'#f0f4ff')}))})();
const SH=[];
function spwn(){if(Math.random()>.007)return;const a=Math.PI/6+Math.random()*Math.PI/5;SH.push({x:Math.random()*W,y:Math.random()*H*.25,len:55+Math.random()*85,sp:5+Math.random()*7,vx:Math.cos(a),vy:Math.sin(a),life:1,dc:.024+Math.random()*.012})}
function sky(now){
  const bg=ctx.createRadialGradient(W*.4,H*.3,0,W*.5,H*.5,Math.max(W,H)*.9);
  bg.addColorStop(0,'#0c0920');bg.addColorStop(.55,'#07051a');bg.addColorStop(1,'#04030e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  [{x:.22,y:.28,rx:.42,ry:.28,c:'rgba(80,55,160,.12)'},{x:.72,y:.55,rx:.38,ry:.25,c:'rgba(110,35,90,.1)'},{x:.48,y:.12,rx:.3,ry:.2,c:'rgba(55,80,145,.09)'}].forEach(n=>{const g=ctx.createRadialGradient(n.x*W,n.y*H,0,n.x*W,n.y*H,Math.max(W,H)*.42);g.addColorStop(0,n.c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(n.x*W,n.y*H,n.rx*W,n.ry*H,0,0,Math.PI*2);ctx.fill()});
  S.forEach(s=>{const a=s.a*(.58+.42*Math.sin(now*s.ts*60+s.to));ctx.globalAlpha=Math.max(0,a);ctx.shadowBlur=s.r>.7?5:0;ctx.shadowColor=s.c;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.px*W,s.py*H,s.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0});
  spwn();
  for(let i=SH.length-1;i>=0;i--){const sh=SH[i];const t=ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*sh.len,sh.y-sh.vy*sh.len);t.addColorStop(0,`rgba(200,190,255,${sh.life*.65})`);t.addColorStop(.5,`rgba(160,150,220,${sh.life*.2})`);t.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-sh.vx*sh.len,sh.y-sh.vy*sh.len);ctx.strokeStyle=t;ctx.lineWidth=1.1;ctx.stroke();sh.x+=sh.vx*sh.sp;sh.y+=sh.vy*sh.sp;sh.life-=sh.dc;if(sh.life<=0||sh.x>W+50||sh.y>H+50)SH.splice(i,1)}
}
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
window.addEventListener('resize',resize);
(function loop(){ctx.clearRect(0,0,W,H);sky(Date.now()*.001);requestAnimationFrame(loop)})();
resize();

// ══ THOUGHTS ══
const THOUGHTS=[
  "Pienso en ti justo antes de cerrar los ojos",
  "Tu manera de reír es lo más bonito del mundo",
  "¿Sabes que me alegras el día solo existiendo?",
  "Tengo mucho frío cuando no estás cerca",
  "Eres bonita incluso cuando no te das cuenta",
  "Ojalá pudiera darte las buenas noches en persona cada noche",
  "Mañana te voy a querer igual que hoy, o más",
  "Que sueñes conmigo"
];

// Add star shapes to DOM
document.querySelectorAll('.tstar').forEach(el=>{
  const d=document.createElement('div'); d.className='sshape'; el.appendChild(d);
});

// ══ INTERACTION ══
const intro=document.getElementById('intro');
const mcard=document.getElementById('mcard');
const mtext=document.getElementById('mtext');
const ctr=document.getElementById('ctr');
const finale=document.getElementById('finale');
let found=0, open=false;

// Reveal stars after intro
setTimeout(()=>{
  intro.classList.add('gone');
  setTimeout(()=>{
    intro.style.display='none';
    document.querySelectorAll('.tstar').forEach(s=>s.classList.add('active'));
  }, 1700);
}, 5200);

// Star click
document.querySelectorAll('.tstar').forEach(star=>{
  star.addEventListener('click', e=>{
    e.stopPropagation();
    if(open || star.classList.contains('found')) return;
    const idx=parseInt(star.dataset.i);
    mtext.textContent=THOUGHTS[idx];
    mcard.classList.add('show');
    open=true;
    star.classList.add('found');
    found++;
    ctr.textContent=`✦ ${found} de 8 pensamientos encontrados`;
    ctr.classList.add('on');
  });
  star.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});
});

// Close card
mcard.addEventListener('click', e=>{
  e.stopPropagation();
  if(!open) return;
  mcard.classList.remove('show');
  open=false;
  if(found===8) setTimeout(showFinale, 750);
});

function showFinale(){
  ctr.style.opacity='0';
  document.querySelectorAll('.tstar').forEach(s=>{ s.style.opacity='0'; s.style.pointerEvents='none' });
  setTimeout(()=>finale.classList.add('show'), 400);
}

// ══ MUSIC ══
const bgm=document.getElementById('bgm');
bgm.src='[TubePull] Amr_Diab_-_Al_Leila_عمرو_دياب_-_الليلة.m4a';
bgm.volume=.72;
function tryPlay(){bgm.play().catch(()=>{})}
tryPlay();
['click','touchstart'].forEach(ev=>document.addEventListener(ev,tryPlay,{once:true}));
</script>
</body>
</html>
