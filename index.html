<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Para ti, Yasmin ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
    html, body { width:100%; height:100%; overflow:hidden; background:#0c0605; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent }

    /* ── PHOTO LAYER ── */
    #pw { position:fixed; inset:0; z-index:0 }
    #photo { width:100%; height:100%; object-fit:cover; object-position:center 25% }

    /* ── MASK CANVAS ── */
    #cv { position:fixed; inset:0; z-index:1; display:block }

    /* ── HINT ── */
    #hint {
      position:fixed; bottom:clamp(2.2rem,6.5vh,4rem); left:50%;
      transform:translateX(-50%); z-index:10; text-align:center;
      pointer-events:none; opacity:0;
      animation:fdin 1.1s ease 2.2s forwards;
      transition:opacity 1.1s;
    }
    #hint.gone { opacity:0!important; animation:none }
    @keyframes fdin { to { opacity:1 } }
    .hlamp { font-size:1.85rem; display:block; margin-bottom:.45rem; animation:hlsway 2.3s ease-in-out infinite }
    @keyframes hlsway {
      0%,100% { transform:rotate(-8deg) }
      50%      { transform:translateX(22px) rotate(8deg) }
    }
    .htxt {
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:clamp(.8rem,2.6vw,.98rem);
      color:rgba(220,195,158,.52); letter-spacing:.1em; line-height:1.8;
    }

    /* ── POPUP ── */
    #popup {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%) scale(.84);
      z-index:20; max-width:min(390px,88vw);
      background:rgba(7,3,1,.97);
      border:1px solid rgba(240,175,80,.22);
      border-radius:15px;
      padding:clamp(1.2rem,3.8vw,2rem) clamp(1.8rem,5.5vw,3rem);
      text-align:center;
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      box-shadow:0 28px 75px rgba(0,0,0,.78), 0 0 0 1px rgba(240,175,80,.08);
      opacity:0; pointer-events:none;
      transition:opacity .42s, transform .42s;
    }
    #popup.show { opacity:1; transform:translate(-50%,-50%) scale(1) }
    .pstar { font-size:.78rem; color:rgba(240,160,55,.55); letter-spacing:.35em; margin-bottom:.5rem; display:block }
    #pmsg {
      font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
      font-size:clamp(1.28rem,5vw,2rem);
      color:rgba(255,236,190,.93); line-height:1.55;
    }
    #pmsg.big {
      font-family:'Dancing Script',cursive; font-weight:700;
      font-size:clamp(2.3rem,9.5vw,4rem);
      color:rgba(255,222,118,.96);
      text-shadow:0 0 45px rgba(255,198,75,.48);
      line-height:1.2;
    }

    /* ── COUNTER ── */
    #ctr {
      position:fixed; bottom:clamp(.9rem,2.8vh,1.5rem); left:50%;
      transform:translateX(-50%); z-index:10;
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:clamp(.7rem,2vw,.84rem);
      color:rgba(200,175,140,.28); letter-spacing:.22em; white-space:nowrap;
      opacity:0; transition:opacity .6s;
    }
    #ctr.on { opacity:1 }

    /* ── FINALE ── */
    #finale {
      position:fixed; inset:0; z-index:30;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:2.5rem;
      pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,.68) 0%, rgba(0,0,0,.32) 62%, rgba(0,0,0,0) 100%);
      opacity:0; transition:opacity 2.8s;
    }
    #finale.show { opacity:1 }
    .fhrt {
      font-size:clamp(2.6rem,10.5vw,5.2rem);
      color:rgba(222,68,96,.9);
      filter:drop-shadow(0 0 30px rgba(222,55,86,.62));
      animation:hbeat 2s ease-in-out infinite;
      display:block; margin-bottom:.8rem;
    }
    @keyframes hbeat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.23)} 30%{transform:scale(1)} 50%{transform:scale(1.12)} }
    .fnm {
      font-family:'Dancing Script',cursive; font-weight:700;
      font-size:clamp(3.2rem,13.5vw,6.2rem);
      color:rgba(255,222,116,.97);
      text-shadow:0 0 68px rgba(255,200,72,.54), 0 0 135px rgba(255,168,42,.2);
      line-height:1.15; margin-bottom:.9rem;
    }
    .fsb {
      font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
      font-size:clamp(.95rem,3.3vw,1.3rem);
      color:rgba(232,202,162,.76); line-height:2.15; margin-bottom:1.2rem;
    }
    .flv {
      font-family:'Cormorant Garamond',serif; font-style:italic;
      font-size:clamp(1.15rem,4.2vw,1.65rem);
      color:rgba(255,226,166,.9);
    }
    @media(max-width:380px){ .fnm{font-size:clamp(2.4rem,15vw,4rem)} .fsb{font-size:clamp(.88rem,4.2vw,1.1rem)} }
  </style>
</head>
<body>

<div id="pw"><img id="photo" src="Captura de pantalla 2026-08-13 032952.png" alt=""></div>
<canvas id="cv"></canvas>
<audio id="bgm" loop></audio>

<div id="hint">
  <span class="hlamp">🕯️</span>
  <div class="htxt">mueve la luz por aquí…<br>hay algo escondido para ti</div>
</div>

<div id="popup">
  <span class="pstar">✦ ✦ ✦</span>
  <div id="pmsg"></div>
</div>

<div id="ctr">✦ 0 de 5 ✦</div>

<div id="finale">
  <span class="fhrt">♥</span>
  <div class="fnm">Yasmin</div>
  <div class="fsb">
    eres el jazmín, la luz y el cielo<br>
    todo junto en una persona.
  </div>
  <div class="flv">Te amo.</div>
</div>

<script>
// ── STATE ──
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const photo= document.getElementById('photo');
const hint = document.getElementById('hint');
const popup= document.getElementById('popup');
const pmsg = document.getElementById('pmsg');
const ctr  = document.getElementById('ctr');
const fin  = document.getElementById('finale');
const bgm  = document.getElementById('bgm');

let W=0, H=0, T={dx:0,dy:0,dw:1,dh:1};
let mx=-999, my=-999, smx=0, smy=0;
let lightR=0, LIGHT_R=120;
let hintGone=false, discovered=0;
let popTimer=null, finaleMode=false, fAlpha=0;
let aCtx=null;

// ── HOTSPOTS (image-relative coords, 0–1) ──
const HS=[
  {rx:.262,ry:.37,r:.09,msg:'tus ojos son\nmi lugar favorito',     big:false,done:false},
  {rx:.615,ry:.37,r:.09,msg:'me pierdo en tu mirada',              big:false,done:false},
  {rx:.450,ry:.50,r:.09,msg:'Yasmin',                              big:true, done:false},
  {rx:.520,ry:.74,r:.11,msg:'eres como el jazmín\nllenas todo de vida', big:false,done:false},
  {rx:.420,ry:.19,r:.10,msg:'me iluminas más\nque cualquier sol',  big:false,done:false},
];

// ── SPARKLES ──
const sparks=[];
function mkSpark(x,y,burst){
  const n=burst?22:1;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=burst?(.8+Math.random()*2.8):(.4+Math.random()*.8);
    sparks.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,r:burst?(1.2+Math.random()*2.2):.8,
      h:30+Math.random()*40|0
    });
  }
}
function tickSparks(){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=.038; s.life-=.026;
    if(s.life<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`hsla(${s.h},88%,72%,${s.life})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
}

// ── TRANSFORM ──
function calcT(){
  const iw=photo.naturalWidth||1, ih=photo.naturalHeight||1;
  const sc=Math.max(W/iw,H/ih);
  const dw=iw*sc, dh=ih*sc;
  const dx=(W-dw)*.5, dy=(H-dh)*.25;
  return{dx,dy,dw,dh,sc};
}
function imgPt(rx,ry){ return{x:T.dx+rx*T.dw, y:T.dy+ry*T.dh} }

function resize(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  LIGHT_R=Math.min(W,H)*.145;
  T=calcT(); smx=W/2; smy=H/2;
}

// ── DRAW LOOP ──
function draw(){
  ctx.clearRect(0,0,W,H);

  // FINALE MODE: fade overlay to 0 then show text
  if(finaleMode){
    fAlpha=Math.max(0,fAlpha-.017);
    if(fAlpha>0){ ctx.fillStyle=`rgba(0,0,0,${fAlpha})`; ctx.fillRect(0,0,W,H) }
    else if(!fin.classList.contains('show')) fin.classList.add('show');
    ctx.globalCompositeOperation='source-over';
    tickSparks();
    requestAnimationFrame(draw); return;
  }

  // Smooth follow
  if(mx>-900){ smx+=(mx-smx)*.11; smy+=(my-smy)*.11 }
  lightR+=(LIGHT_R-lightR)*.09;

  // Dark overlay
  ctx.fillStyle='rgba(0,0,0,.915)';
  ctx.fillRect(0,0,W,H);

  if(mx>-900){
    // Warm lantern hole
    ctx.globalCompositeOperation='destination-out';
    const lg=ctx.createRadialGradient(smx,smy,0,smx,smy,lightR);
    lg.addColorStop(0,  'rgba(0,0,0,1)');
    lg.addColorStop(.6, 'rgba(0,0,0,.88)');
    lg.addColorStop(1,  'rgba(0,0,0,0)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);

    // Warm halo ring (amber glow at light edge)
    ctx.globalCompositeOperation='source-over';
    const hg=ctx.createRadialGradient(smx,smy,lightR*.7,smx,smy,lightR*1.4);
    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(.5,'rgba(165,85,22,.11)');
    hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);

    // Eye sparkle: when light is near eye hotspots, emit golden glints
    [0,1].forEach(i=>{
      const p=imgPt(HS[i].rx,HS[i].ry);
      if(Math.hypot(smx-p.x,smy-p.y)<lightR*1.15 && Math.random()<.055)
        mkSpark(p.x+(Math.random()-.5)*12,p.y+(Math.random()-.5)*10,false);
    });

    // Hotspot check
    checkHS(smx,smy);
  }

  ctx.globalCompositeOperation='source-over';
  tickSparks();
  requestAnimationFrame(draw);
}

// ── HOTSPOT CHECK ──
let lastCheck=0;
function checkHS(x,y){
  const now=Date.now(); if(now-lastCheck<180) return; lastCheck=now;
  HS.forEach(h=>{
    if(h.done) return;
    const p=imgPt(h.rx,h.ry);
    if(Math.hypot(x-p.x,y-p.y) < h.r*Math.min(T.dw,T.dh)){
      h.done=true; discovered++;
      mkSpark(p.x,p.y,true);
      playChime();
      showPopup(h.msg,h.big);
      ctr.textContent=`✦ ${discovered} de 5 ✦`; ctr.classList.add('on');
      if(discovered>=3) setTimeout(triggerFinale,1900);
    }
  });
}

// ── POPUP ──
function showPopup(msg,big){
  pmsg.className=big?'big':'';
  pmsg.innerHTML=msg.replace('\n','<br>');
  popup.classList.add('show');
  if(popTimer) clearTimeout(popTimer);
  popTimer=setTimeout(()=>popup.classList.remove('show'),2500);
}

// ── FINALE ──
function triggerFinale(){
  if(finaleMode)return;
  popup.classList.remove('show');
  finaleMode=true; fAlpha=.915;
}

// ── CHIME SOUND ──
function playChime(){
  try{
    if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();
    [0,150,300].forEach((delay,i)=>{
      const o=aCtx.createOscillator(),g=aCtx.createGain();
      o.connect(g);g.connect(aCtx.destination);
      o.type='sine';
      const freqs=[523,659,784]; // C5 E5 G5
      o.frequency.value=freqs[i];
      const t=aCtx.currentTime+delay*.001;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.18,t+.05);
      g.gain.exponentialRampToValueAtTime(.001,t+.65);
      o.start(t);o.stop(t+.65);
    });
  }catch(e){}
}

// ── EVENTS ──
function setPos(e){
  const c=e.touches?e.touches[0]:e;
  mx=c.clientX; my=c.clientY;
}
function hideHint(){ if(!hintGone){hint.classList.add('gone');hintGone=true} }

cv.addEventListener('mousemove',e=>{setPos(e);hideHint()});
cv.addEventListener('touchstart',e=>{e.preventDefault();setPos(e);hideHint()},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault();setPos(e)},{passive:false});
cv.addEventListener('touchend',  e=>{e.preventDefault()},{passive:false});

// ── INIT ──
photo.addEventListener('load',()=>{ T=calcT() });
window.addEventListener('resize',()=>{ resize() });
resize();
requestAnimationFrame(draw);

// ── MUSIC ──
bgm.src='[TubePull] Amr_Diab_-_Al_Leila_عمرو_دياب_-_الليلة.m4a';
bgm.volume=.72;
function tryPlay(){bgm.play().catch(()=>{})}
tryPlay();
['click','touchstart'].forEach(ev=>document.addEventListener(ev,tryPlay,{once:true}));
</script>
</body>
</html>
