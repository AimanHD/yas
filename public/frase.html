<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yasmin</title>
  <link rel="icon" type="image/png" href="/favi.png">
  <link rel="apple-touch-icon" href="/favi.png">
  <meta name="theme-color" content="#0a0714">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <!-- La app completa sigue en /app.html; esta portada solo muestra la frase -->
  <style>
    html, body { margin:0; height:100%; }
    body {
      background:radial-gradient(ellipse at 50% 30%, #1d1430 0%, #0d0919 55%, #06040c 100%);
      display:grid; place-items:center; overflow:hidden;
    }
    p {
      margin:0; width:min(34rem, calc(100vw - 3rem)); text-align:center;
      font-family:'Playfair Display', Georgia, serif; font-style:italic; font-weight:400;
      font-size:clamp(1.5rem, 6vw, 2.4rem); line-height:1.4;
      color:#f6ead6; text-shadow:0 0 28px rgba(255,236,200,.25);
      opacity:0; animation:aparecer 2.4s ease .3s forwards;
    }
    @keyframes aparecer { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion: reduce) { p { animation:none; opacity:1 } }
  </style>
</head>
<body>
  <p>Tus ojos los seguiré viendo cuando tenga de frente las estrellas</p>
</body>
</html>
